# Overrides on top of detekt's default config. Gradle and config/bin/detekt-cli both run with
# buildUponDefaultConfig and allRules, so only deviations from the defaults belong here. Run
# `./gradlew detektGenerateConfig` to see every rule and its default value.

complexity:
  LongParameterList:
    ignoreDefaultParameters: true

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
