- config:
    id: clerk/e2e/user-profile-security-delete-account
    target: clerk-e2e
    platform: android
    driver: ANDROID_ONDEVICE_ACCESSIBILITY
    tags:
      - e2e
      - prebuilt-ui
      - user-profile
- tools:
    - launchApp:
        appId: com.clerk.e2e
        launchMode: REINSTALL
- prompts:
    - verify: The e2e host shows the signed-out marker.
    - step: Start the prebuilt sign-up with the generated test email and continue.
    - step: Create the password ClerkAndroid2026E2ETestPassword9! and continue.
    - step: Enter the email verification code 424242.
    - verify: The e2e host shows a signed-in user with an active session.
    - step: Open the user profile from the user button and open Security.
    - step: Delete the account from Security by confirming with DELETE.
    - verify: Deleting the account signs the e2e host out.
