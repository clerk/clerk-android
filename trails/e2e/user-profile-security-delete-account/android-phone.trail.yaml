- config:
    id: clerk/e2e/user-profile-security-delete-account
    target: clerk-e2e
    platform: android
    driver: ANDROID_ONDEVICE_ACCESSIBILITY
    tags:
      - e2e
      - prebuilt-ui
      - user-profile
- tools:
    - launchApp:
        appId: com.clerk.e2e
        launchMode: REINSTALL
- prompts:
    - verify: The e2e host shows the signed-out marker.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the e2e host is signed out before the flow starts.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedOut
    - step: Start the prebuilt sign-up with the generated test email and continue.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Open the prebuilt AuthView in sign-up mode with the generated test email.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signUpWithEmail
          - assertVisibleBySelector:
              reason: Verify the sign-up start screen is shown.
              timeoutMs: 30000
              nodeSelector:
                androidAccessibility:
                  textRegex: Create your account
          - tapOnElementBySelector:
              reason: Submit the prefilled test email.
              nodeSelector:
                androidAccessibility:
                  textRegex: Continue
    - step: Create the password ClerkAndroid2026E2ETestPassword9! and continue.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the sign-up asks for a password.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Create a unique password
          - tapOnElementBySelector:
              reason: Focus the password field.
              nodeSelector:
                androidAccessibility:
                  textRegex: Enter your password
          - inputText:
              text: "ClerkAndroid2026E2ETestPassword9!"
              hideKeyboardAfter: true
          - tapOnElementBySelector:
              reason: Submit the password.
              nodeSelector:
                androidAccessibility:
                  textRegex: Continue
    - step: Enter the email verification code 424242.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the email verification code screen is shown.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Check your email
          - inputText:
              text: "424242"
              hideKeyboardAfter: false
    - verify: The e2e host shows a signed-in user with an active session.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the e2e host reports a signed-in user.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedIn
          - assertVisibleBySelector:
              reason: Verify the session is active.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.sessionActive
    - step: Open the user profile from the user button and open Security.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Open the user profile from the UserButton.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.userButton
          - assertVisibleBySelector:
              reason: Verify the user profile root is shown.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Security
          - tapOnElementBySelector:
              reason: Open the Security screen.
              nodeSelector:
                androidAccessibility:
                  textRegex: Security
          - scrollUntilTextIsVisible:
              text: Delete account
              direction: DOWN
    - step: Delete the account from Security by confirming with DELETE.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Open the delete account confirmation.
              nodeSelector:
                androidAccessibility:
                  textRegex: Delete account
          - assertVisibleBySelector:
              reason: Verify the delete confirmation field is shown.
              timeoutMs: 30000
              nodeSelector:
                androidAccessibility:
                  textRegex: Type .DELETE. to continue
          - tapOnElementBySelector:
              reason: Focus the delete confirmation field.
              nodeSelector:
                androidAccessibility:
                  textRegex: Type .DELETE. to continue
          - inputText:
              text: "DELETE"
              hideKeyboardAfter: true
          - tapOnElementBySelector:
              reason: Confirm account deletion with the button below the confirmation field.
              nodeSelector:
                androidAccessibility:
                  textRegex: Delete account
                below:
                  androidAccessibility:
                    textRegex: DELETE
    - verify: Deleting the account signs the e2e host out.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the e2e host is signed out after deleting the account.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedOut
