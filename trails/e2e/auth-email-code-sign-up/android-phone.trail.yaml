- config:
    id: clerk/e2e/auth-email-code-sign-up
    target: clerk-e2e
    platform: android
    driver: ANDROID_ONDEVICE_ACCESSIBILITY
    tags:
      - e2e
      - prebuilt-ui
      - auth-email
- tools:
    - launchApp:
        appId: com.clerk.e2e
        launchMode: REINSTALL
- prompts:
    - verify: The e2e host shows the signed-out marker.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the e2e host is signed out before the flow starts.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedOut
    - step: Start the prebuilt sign-up with the generated test email and continue.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Open the prebuilt AuthView in sign-up mode with the generated test email.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signUpWithEmail
          - assertVisibleBySelector:
              reason: Verify the sign-up start screen is shown.
              timeoutMs: 30000
              nodeSelector:
                androidAccessibility:
                  textRegex: Create your account
          - tapOnElementBySelector:
              reason: Submit the prefilled test email.
              nodeSelector:
                androidAccessibility:
                  textRegex: Continue
    - step: Create the password ClerkAndroid2026E2ETestPassword9! and continue.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the sign-up asks for a password.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Create a unique password
          - tapOnElementBySelector:
              reason: Focus the password field.
              nodeSelector:
                androidAccessibility:
                  textRegex: Enter your password
          - inputText:
              text: "ClerkAndroid2026E2ETestPassword9!"
              hideKeyboardAfter: true
          - tapOnElementBySelector:
              reason: Submit the password.
              nodeSelector:
                androidAccessibility:
                  textRegex: Continue
    - step: Enter the email verification code 424242.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the email verification code screen is shown.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Check your email
          - inputText:
              text: "424242"
              hideKeyboardAfter: false
    - verify: The e2e host shows a signed-in user with an active session.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the e2e host reports a signed-in user.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedIn
          - assertVisibleBySelector:
              reason: Verify the session is active.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.sessionActive
    - step: Delete the test account from the e2e host and verify it is signed out.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Delete the test account from the e2e host.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.deleteAccount
          - assertVisibleBySelector:
              reason: Verify the e2e host is signed out after deleting the account.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedOut
