- config:
    id: clerk/e2e/session-task-setup-mfa
    target: clerk-e2e
    platform: android
    driver: ANDROID_ONDEVICE_ACCESSIBILITY
    tags:
      - e2e
      - prebuilt-ui
      - session-task-setup-mfa
- tools:
    - launchApp:
        appId: com.clerk.e2e
        launchMode: REINSTALL
- prompts:
    - verify: The e2e host shows the signed-out marker.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the e2e host is signed out before the flow starts.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedOut
    - step: Start the prebuilt sign-up with the generated test email and continue.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Open the prebuilt AuthView in sign-up mode with the generated test email.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signUpWithEmail
          - assertVisibleBySelector:
              reason: Verify the sign-up start screen is shown.
              timeoutMs: 30000
              nodeSelector:
                androidAccessibility:
                  textRegex: Create your account
          - tapOnElementBySelector:
              reason: Submit the prefilled test email.
              nodeSelector:
                androidAccessibility:
                  textRegex: Continue
    - step: Enter the email verification code 424242.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the email verification code screen is shown.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Check your email
          - inputText:
              text: "424242"
              hideKeyboardAfter: false
    - verify: The new session is pending with the setup-mfa task.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the session is pending.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.sessionPending
          - assertVisibleBySelector:
              reason: Verify the pending tasks include setup-mfa.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.pendingTasks
                  textRegex: .*setup-mfa.*
    - step: Choose the authenticator application on the two-step verification setup screen.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the setup MFA session task screen is shown.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Set up two-step verification
          - tapOnElementBySelector:
              reason: Choose the authenticator application method.
              nodeSelector:
                androidAccessibility:
                  textRegex: Authenticator application
          - assertVisibleBySelector:
              reason: Verify the TOTP secret screen is shown.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Add authenticator application
    - step: Copy the TOTP secret, continue, and type the current TOTP code with the e2e host helper.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Copy the TOTP secret, which is the first copy button.
              nodeSelector:
                androidAccessibility:
                  textRegex: Copy to clipboard
                index: 0
          - tapOnElementBySelector:
              reason: Continue to TOTP verification.
              nodeSelector:
                androidAccessibility:
                  textRegex: Continue
          - assertVisibleBySelector:
              reason: Verify the TOTP verification screen is shown.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  textRegex: Verify authenticator app
          - tapOnElementBySelector:
              reason: Type the current TOTP code into the focused code field.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.totp\.typeCode
          - assertVisibleBySelector:
              reason: Verify the e2e host typed the TOTP code.
              timeoutMs: 20000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.totp\.typed
    - verify: Completing MFA setup activates the session.
      recording:
        tools:
          - assertVisibleBySelector:
              reason: Verify the session is active after MFA setup.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.sessionActive
    - step: Delete the test account from the e2e host and verify it is signed out.
      recording:
        tools:
          - tapOnElementBySelector:
              reason: Delete the test account from the e2e host.
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.deleteAccount
          - assertVisibleBySelector:
              reason: Verify the e2e host is signed out after deleting the account.
              timeoutMs: 45000
              nodeSelector:
                androidAccessibility:
                  resourceIdRegex: e2e\.auth\.signedOut
