# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true
reviews:
  path_filters:
    - "!source/*/api/*.api"
    - "!**/detekt-baseline.xml"
    - "!source/ui/lint-baseline.xml"
    - "!source/ui/src/test/**/snapshots/images/**"
    - "!**/package-lock.json"
  auto_approvals:
    enabled: true
    allow_author_approval: false
    max_merge_risk: moderate
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Testing, risk, and revert"
        mode: error
        instructions: |
          The PR description has a Testing, a Risk, and a How to revert section, and each one says something specific to this PR.
          FAIL if any of the three is missing, empty, a lone "-", only the template's HTML comment, or a placeholder with no reason, such as "TBD", "N/A", "none", or "n/a".
          PASS when each section names something about this PR. A short answer with a reason passes, such as "Low: docs only" for Risk or "A plain revert is enough" for How to revert.
      - name: "Device evidence"
        mode: error
        instructions: |
          This check only asks whether the PR has any device evidence at all. It does not judge how much evidence there is or what it covers.
          PASS if the diff changes no file under `source/api/`, `source/ui/`, or `e2e/`.
          Otherwise PASS if the PR description has at least one screenshot or video of the app running on an emulator or device, embedded or linked, or says why the change could not be run on one. One screenshot or one video is enough.
          Don't check whether the evidence covers every screen or state the diff touches, whether it shows a before and an after, or how it is laid out, and don't list missing screens or states.
          FAIL only when the diff touches those paths and the description has neither any screenshot or video nor a reason for leaving them out. A link to CI or a test run, or snapshot test images, is not device evidence.
  auto_review:
    drafts: false
  finishing_touches:
    autofix:
      enabled: false
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false
  collapse_walkthrough: false
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Write an explainer for a teammate who doesn't know this part of the code. In three to six plain sentences, say how the touched area worked before this PR, what changes, and where a reviewer should look first. Don't repeat the file list.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
      - "REVIEW.md"
