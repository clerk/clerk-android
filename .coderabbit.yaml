# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_filters:
    - "!source/*/api/*.api"
    - "!**/detekt-baseline.xml"
    - "!source/ui/lint-baseline.xml"
    - "!source/ui/src/test/**/snapshots/images/**"
    - "!**/package-lock.json"
  auto_approvals:
    enabled: true
    allow_author_approval: false
    max_merge_risk: moderate
  pre_merge_checks:
    override_requested_reviewers_only: true
    custom_checks:
      - name: "Testing, risk, and revert"
        mode: error
        instructions: |
          The PR description has a Testing, a Risk, and a How to revert section, and each one says something specific to this PR.
          FAIL if any of the three is missing, empty, a lone "-", or only the template's HTML comment.
          PASS otherwise. "A plain revert is enough" counts as a real answer for How to revert.
      - name: "Device evidence"
        mode: error
        instructions: |
          PASS if the diff changes no file under `source/api/`, `source/ui/`, or `e2e/`.
          Otherwise PASS only if the PR description has screenshots or a video of the change on an emulator or device, or says why it could not be run on one.
          FAIL otherwise. A link to CI, a test run, or snapshot images is not device evidence.
  auto_review:
    drafts: false
    auto_pause_after_reviewed_commits: 3
  collapse_walkthrough: false
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Write an explainer for a teammate who doesn't know this part of the code. In three to six plain sentences, say how the touched area worked before this PR, what changes, and where a reviewer should look first. Don't repeat the file list.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "REVIEW.md"
