name: Rake unused dependencies

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rake-dependencies
  cancel-in-progress: false

env:
  BRANCH_NAME: automation/rake-dependencies
  PR_TITLE: "chore(deps): remove unused dependencies"

jobs:
  rake:
    if: github.event_name != 'schedule' || github.repository == 'clerk/clerk-android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      # Pushes and pull requests made with the GITHUB_TOKEN start no workflow runs, so without a
      # token of its own the pull request gets no CI until someone closes and reopens it.
      GH_TOKEN: ${{ secrets.DEPENDENCY_RAKE_GH_TOKEN || github.token }}
      HAS_OWN_TOKEN: ${{ secrets.DEPENDENCY_RAKE_GH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ env.GH_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Rake dependencies
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew rakeDependencies --continue | tee "$RUNNER_TEMP/rake.log"

      - name: Format the raked build files
        id: changes
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- '*.gradle.kts')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Nothing to rake."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          config/bin/sort-dependencies "${changed[@]}"
          ./gradlew spotlessApply
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Close the open pull request
        if: steps.changes.outputs.changed == 'false'
        run: |
          set -euo pipefail
          pr="$(gh pr list --head "$BRANCH_NAME" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "The rake on main finds nothing to remove now."
          fi

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git commit --quiet --all --message "$PR_TITLE"

          pr="$(gh pr list --head "$BRANCH_NAME" --state open --json url --jq '.[0].url // ""')"
          if git fetch --quiet origin "$BRANCH_NAME" 2>/dev/null &&
            [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            if [ -n "$pr" ]; then
              echo "$pr already has these changes."
              exit 0
            fi
          else
            git push --force origin "HEAD:refs/heads/$BRANCH_NAME"
          fi

          body="$RUNNER_TEMP/body.md"
          {
            echo "## What & why"
            echo
            echo "The nightly \`./gradlew rakeDependencies\` run on \`main\` found declarations no code uses. It removes them, and declares any used dependency that only a removed one provided."
            echo
            echo '```'
            grep -E '^(Raked |  [-+] |  kept )' "$RUNNER_TEMP/rake.log" || true
            echo '```'
            echo
            echo "## Testing"
            echo
            echo "CI builds and tests every module. The analysis sees only what compiles against what, so a failing test here can mean a removed dependency was needed at runtime: move it to \`runtimeOnly\` or \`testRuntimeOnly\` on this branch."
            echo
            echo "## How to revert"
            echo
            echo "Revert the commit. The next run reopens this pull request if the dependencies are still unused."
            echo
            echo "[Rake run]($RUN_URL)"
          } > "$body"

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$PR_TITLE" --body-file "$body"
          else
            pr="$(gh pr create --base main --head "$BRANCH_NAME" --title "$PR_TITLE" --body-file "$body")"
          fi
          echo "Pull request: $pr" >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_OWN_TOKEN" != "true" ]; then
            echo "::warning::DEPENDENCY_RAKE_GH_TOKEN is not configured, so CI won't start on $pr until someone closes and reopens it."
          fi

  notify:
    needs: rake
    if: ${{ always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/notify-nightly-failure.yml
    with:
      checks: dependency rake
      workflows: rake-dependencies.yml
    secrets:
      SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL }}
