name: verify-remote
run-name: verify-remote ${{ inputs.owner }}/${{ inputs.session }}

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Random id of the driver's checkout, so it can find and end its own sessions
        required: true
      session:
        description: Session id the driver chose
        required: true
      request:
        description: The session request as one JSON string (src/core/remote/protocol.ts of @clerk/internal-mobile-e2e)
        required: true

permissions:
  contents: read

env:
  PACKAGE: e2e-tests

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      runner: ${{ steps.plan.outputs.runner }}
      device: ${{ steps.plan.outputs.device }}
      sha: ${{ steps.plan.outputs.sha }}
      timeout: ${{ steps.plan.outputs.timeout }}
      request: ${{ steps.plan.outputs.request }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: e2e-tests
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the package's pinned tools
        timeout-minutes: 3
        run: npm ci --prefix "$PACKAGE" --no-audit --no-fund
      - name: Read the request
        id: plan
        env:
          VERIFY_REQUEST: ${{ inputs.request }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$PACKAGE/node_modules/.bin/internal-mobile-e2e-session-agent" plan'
      - name: Check the runner label
        if: steps.plan.outputs.mode == 'session'
        env:
          RUNNER_LABEL: ${{ steps.plan.outputs.runner }}
        run: |
          case "$RUNNER_LABEL" in
            ubuntu-24.04 | ubuntu-latest) ;;
            *)
              echo "::error title=verify-remote::no session started: the runner label $RUNNER_LABEL is not ubuntu-24.04 or ubuntu-latest"
              exit 1
              ;;
          esac

  session:
    needs: plan
    if: needs.plan.outputs.mode == 'session'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    env:
      VERIFY_SESSION_REQUEST: ${{ needs.plan.outputs.request }}
      # agent-device reaps its daemon and its device lease after five idle minutes by default.
      AGENT_DEVICE_DAEMON_IDLE_TIMEOUT_MS: "0"
      AGENT_DEVICE_LEASE_TTL_MS: "21600000"
      AGENT_DEVICE_LEASE_MAX_TTL_MS: "21600000"
      SESSION_BUILD: e2e-tests/src/platform/android/session-build.ts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        if: needs.plan.outputs.device != ''
        with:
          java-version: "21"
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v6
        if: needs.plan.outputs.device != ''
        with:
          cache-disabled: true

      - name: Install the package's pinned tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify-remote"
          echo "start $(date +%s)000" >> "$RUNNER_TEMP/verify-remote/marks"
          npm ci --prefix "$PACKAGE" --no-audit --no-fund
          "$PACKAGE/node_modules/.bin/agent-device" --version
          echo "tools-installed $(date +%s)000" >> "$RUNNER_TEMP/verify-remote/marks"

      - name: Make the work directory and name the device
        id: device
        env:
          DEVICE: ${{ needs.plan.outputs.device }}
        run: |
          set -euo pipefail
          echo "VERIFY_SESSION_WORK=$RUNNER_TEMP/verify-remote" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Linux ] && [ -n "$DEVICE" ]; then
            [ -x "$ANDROID_HOME/platform-tools/adb" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install platform-tools < /dev/null > /dev/null
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
            echo "serial=$(node "$PACKAGE/src/platform/android/session-lane.ts" serial)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Android platform the build compiles against
        if: steps.device.outputs.serial != ''
        run: |
          for package in $(node "$SESSION_BUILD" platform "$VERIFY_SESSION_WORK"); do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$package" < /dev/null > /dev/null && break
          done

      - name: Name the APK
        id: app
        if: steps.device.outputs.serial != ''
        run: node "$SESSION_BUILD" name "$VERIFY_SESSION_WORK"

      - name: Restore the APK that an earlier build stored
        id: stored
        if: steps.app.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/verify-remote/apks/${{ steps.app.outputs.key }}
          key: verify-e2e-apk-${{ steps.app.outputs.key }}

      - name: Restore the build state
        if: steps.device.outputs.serial != ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            !~/.gradle/caches/build-cache-1
            ~/.gradle/wrapper
            .gradle
            e2e/build
            source/api/build
            source/ui/build
            source/telemetry/build
          key: verify-gradle-${{ steps.app.outputs.toolchain }}-${{ steps.app.outputs.key || github.run_id }}
          restore-keys: |
            verify-gradle-${{ steps.app.outputs.toolchain }}-
            verify-gradle-

      - name: Start the session agent and tunnel
        id: tunnel
        env:
          VERIFY_SESSION_DEVICE_ID: ${{ steps.device.outputs.serial }}
          VERIFY_SESSION_DEVICE_NAME: ${{ needs.plan.outputs.device }}
          VERIFY_SESSION_DEVICE_MODULE: e2e-tests/src/platform/android/session-device.ts
          VERIFY_SESSION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARED_VERSION: "2026.9.3"
          CLOUDFLARED_SHA256: 77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2
        run: |
          set -euo pipefail
          WORK="$VERIFY_SESSION_WORK"
          [ "$(uname -s)-$(uname -m)" = Linux-x86_64 ] || { echo "::error::a session needs a Linux x64 runner, and this one is $(uname -s)-$(uname -m)"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$WORK/cloudflared" "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-linux-amd64"
          echo "$CLOUDFLARED_SHA256  $WORK/cloudflared" | shasum -a 256 -c -
          chmod +x "$WORK/cloudflared"
          VERIFY_SESSION_CLOUDFLARED="$WORK/cloudflared" \
            nohup "$PACKAGE/node_modules/.bin/internal-mobile-e2e-session-agent" serve > "$WORK/agent.log" 2>&1 &
          disown
          echo "agent-started $(date +%s)000" >> "$WORK/marks"
          for _ in $(seq 1 150); do
            sleep 1
            [ -s "$WORK/tunnel" ] && break
            pgrep -f 'internal-mobile-e2e-session-agent serve' > /dev/null || { echo "::error::the session agent ended before a tunnel came up"; break; }
          done
          [ -s "$WORK/tunnel" ] || { echo "::error::no tunnel came up"; tail -n 20 "$WORK/agent.log" "$WORK/tunnel.log" || true; exit 1; }
          echo "tunnel-up $(date +%s)000" >> "$WORK/marks"
          echo "host=$(cat "$WORK/tunnel")" >> "$GITHUB_OUTPUT"

      - name: verify-remote tunnel ${{ steps.tunnel.outputs.host }}
        run: "true"

      - name: Start the emulator
        if: steps.device.outputs.serial != ''
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          IMAGE="system-images;android-36;google_apis;x86_64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$IMAGE" emulator < /dev/null > "$VERIFY_SESSION_WORK/sdkmanager.log" 2>&1 \
            || { echo "::error::sdkmanager could not install $IMAGE"; tail -20 "$VERIFY_SESSION_WORK/sdkmanager.log"; exit 1; }
          echo "boot-started $(date +%s)000" >> "$VERIFY_SESSION_WORK/marks"
          nohup node "$PACKAGE/src/platform/android/session-lane.ts" boot "$VERIFY_SESSION_WORK" > "$VERIFY_SESSION_WORK/lane.log" 2>&1 &
          disown

      - name: Wait for the emulator
        if: steps.device.outputs.serial != ''
        timeout-minutes: 6
        run: |
          until [ -f "$VERIFY_SESSION_WORK/lane-ready" ]; do
            if [ -f "$VERIFY_SESSION_WORK/lane-failed" ]; then
              echo "::error::the emulator did not boot: $(cat "$VERIFY_SESSION_WORK/lane-failed")"
              tail -20 "$HOME/.verify/emulators/android-1.log" || true
              exit 1
            fi
            sleep 2
          done
          echo "booted $(date +%s)000" >> "$VERIFY_SESSION_WORK/marks"
          cat "$VERIFY_SESSION_WORK/lane.log"

      - name: Mark the device ready
        run: |
          touch "$VERIFY_SESSION_WORK/device-ready"
          echo "device-ready $(date +%s)000" >> "$VERIFY_SESSION_WORK/marks"

      - name: Report the APK and the stage times
        id: report
        if: steps.device.outputs.serial != ''
        run: |
          for _ in $(seq 1 1500); do
            pgrep -f 'session-build.ts build' > /dev/null || break
            sleep 1
          done
          if pgrep -f 'session-build.ts build' > /dev/null; then
            echo "::warning title=verify::a build was still running after 25 minutes, so nothing it builds is stored"
          fi
          node "$SESSION_BUILD" outcome "$VERIFY_SESSION_WORK"
          node "$SESSION_BUILD" stages "$VERIFY_SESSION_WORK"

      - name: Check whether the session built uncommitted changes
        id: patched
        run: |
          if [ -f "$VERIFY_SESSION_WORK/patched" ]; then
            echo "::notice title=verify::this session built uncommitted changes, so it stores nothing for later sessions"
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Store the APK for the next session with the same sources, JDK and Android platform
        if: steps.patched.outputs.built != 'true' && steps.report.outputs.store != '' && steps.report.outputs.store == steps.app.outputs.key
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/verify-remote/apks/${{ steps.report.outputs.store }}
          key: verify-e2e-apk-${{ steps.report.outputs.store }}

      - name: Hold the session
        run: |
          set -uo pipefail
          while [ ! -f "$VERIFY_SESSION_WORK/ended" ]; do
            pgrep -f 'internal-mobile-e2e-session-agent serve' > /dev/null || [ -f "$VERIFY_SESSION_WORK/ended" ] || { echo "::error::the session agent died"; tail -30 "$VERIFY_SESSION_WORK/agent.log"; exit 1; }
            sleep 3
          done
          echo "session ended: $(cat "$VERIFY_SESSION_WORK/ended")"

      - name: Shut down
        if: always()
        env:
          SERIAL: ${{ steps.device.outputs.serial }}
        run: |
          pkill -f 'internal-mobile-e2e-session-agent serve' || true
          if [ -n "$SERIAL" ]; then adb -s "$SERIAL" emu kill || true; fi

      - name: Keep the evidence that attach handed off
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-evidence
          path: ${{ runner.temp }}/verify-remote/evidence/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
