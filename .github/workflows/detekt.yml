name: Detekt
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detekt:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: detekt
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: zulu
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `detekt` covers every module and source set without type resolution. The SDK modules'
      # production sources also run with type resolution so rules such as InjectDispatcher fire.
      - name: Run detekt
        run: >-
          ./gradlew detekt
          :source:api:detektDebug
          :source:ui:detektDebug
          :source:telemetry:detektDebug
          --build-cache --parallel --continue
