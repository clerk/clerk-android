name: Notify Slack of a failed nightly run

on:
  workflow_call:
    inputs:
      checks:
        description: The checks that failed, as the message names them.
        required: true
        type: string
      workflows:
        description: The workflow files whose passing runs count as the last passing run of these checks, one per line. A workflow that runs the checks in one of its jobs, such as the release, is written file=job, and a run of it counts only when that job passed.
        required: true
        type: string
    secrets:
      SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Notify Slack
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the script that lists the merged pull requests
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/nightly-failure-message.mjs
          sparse-checkout-cone-mode: false

      # The message goes out without the list when the checkout or the script fails.
      - name: Notify Slack
        if: always()
        timeout-minutes: 3
        env:
          SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          CHECKS: ${{ inputs.checks }}
          WORKFLOWS: ${{ inputs.workflows }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL is not configured; skipping Slack notification"
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message=":red_circle: $GITHUB_REPOSITORY nightly $CHECKS failed · <$run_url|View the run>"
          workflows=()
          while IFS= read -r workflow; do
            workflows+=("$workflow")
          done <<< "${WORKFLOWS%$'\n'}"
          if since="$(timeout 90 node .github/scripts/nightly-failure-message.mjs "${workflows[@]}")"; then
            message="$message"$'\n'"$since"
          else
            echo "::warning::Could not list the pull requests merged since the last passing run; the message has only its first line"
          fi

          PAYLOAD=$(jq -n --arg text "$message" '{text: $text, unfurl_links: false, unfurl_media: false}')

          curl --fail-with-body \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 60 \
            --retry-all-errors \
            --request POST \
            --header "Content-type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL"
