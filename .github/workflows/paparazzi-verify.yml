name: Paparazzi Verify

on:
  workflow_dispatch:
    inputs:
      record:
        description: Record the snapshots on this runner and upload them as the paparazzi-snapshots artifact, instead of verifying them.
        type: boolean
        default: false
  workflow_call:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule' || github.repository == 'clerk/clerk-android'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Paparazzi snapshots
        if: ${{ !inputs.record }}
        timeout-minutes: 20
        run: ./gradlew :source:ui:verifyPaparazziDebug --stacktrace

      - name: Record Paparazzi snapshots
        if: inputs.record
        timeout-minutes: 20
        run: ./gradlew :source:ui:recordPaparazziDebug --stacktrace

      - name: Upload the recorded snapshots
        if: inputs.record
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-snapshots
          retention-days: 7
          path: source/ui/src/test/snapshots/images/
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-test-results
          retention-days: 7
          path: source/ui/build/test-results/
          if-no-files-found: warn

      - name: Upload Paparazzi report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-report
          retention-days: 7
          path: |
            **/build/reports/paparazzi/**
            **/build/paparazzi/**

      - name: Add run summary
        if: failure()
        run: |
          {
            echo "### Paparazzi differences detected";
            echo "";
            echo "- A **paparazzi-report** artifact was uploaded with the HTML report and image diffs.";
            echo "- If the change is intended, start this workflow with **record** checked and commit the images from its **paparazzi-snapshots** artifact. Snapshots recorded on another machine render differently.";
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: verify
    if: ${{ always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/notify-nightly-failure.yml
    with:
      checks: Paparazzi screenshot tests
      workflows: |
        paparazzi-verify.yml
        manual-release.yml=paparazzi-verify / verify
    secrets:
      SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL }}
