name: Paparazzi Verify

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule' || github.repository == 'clerk/clerk-android'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ⬇️ replace :source:ui with your module path(s)
      - name: Verify Paparazzi snapshots
        run: ./gradlew :source:ui:verifyPaparazziDebug --stacktrace

      # Upload HTML report + image diffs when verification fails
      - name: Upload Paparazzi report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-report
          retention-days: 7
          path: |
            **/build/reports/paparazzi/**
            **/build/paparazzi/**

      # Bonus: add a short summary to the run
      - name: Add run summary
        if: failure()
        run: |
          {
            echo "### Paparazzi differences detected";
            echo "";
            echo "- A **paparazzi-report** artifact was uploaded with the HTML report and image diffs.";
            echo "- If expected, re-record locally and commit updated goldens.";
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: verify
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/notify-nightly-failure.yml
    with:
      checks: Paparazzi screenshot tests
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
