name: Integration Tests
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main" ]

jobs:
  integration-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile packaged integration tests
        run: ./gradlew :source:api:assembleDebugAndroidTest --build-cache

      - name: Check live integration configuration
        id: integration-key
        env:
          CLERK_INTEGRATION_TEST_PK: ${{ secrets.CLERK_INTEGRATION_TEST_PK }}
        run: |
          if [ -n "$CLERK_INTEGRATION_TEST_PK" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live integration did not run: CLERK_INTEGRATION_TEST_PK is unavailable."
            echo "Live integration **not run**: development-instance configuration is unavailable. Compilation alone passed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enable KVM
        if: steps.integration-key.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run live integration through packaged QuickJS
        if: steps.integration-key.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CLERK_INTEGRATION_TEST_PK: ${{ secrets.CLERK_INTEGRATION_TEST_PK }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/run-integration-tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            source/api/build/test-results/**
            source/api/build/reports/tests/**
            source/api/build/outputs/androidTest-results/**
            source/api/build/reports/androidTests/**
          if-no-files-found: warn
