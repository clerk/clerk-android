name: Integration Tests
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_key:
        description: Fail when CLERK_INTEGRATION_TEST_PK is empty, instead of skipping every test.
        required: false
        type: boolean
        default: false
    secrets:
      CLERK_INTEGRATION_TEST_PK:
        required: true
      SLACK_WEBHOOK_URL:
        required: false
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  integration-test:
    if: github.event_name != 'schedule' || github.repository == 'clerk/clerk-android'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check that the integration tests have a key
        if: inputs.require_key
        env:
          CLERK_INTEGRATION_TEST_PK: ${{ secrets.CLERK_INTEGRATION_TEST_PK }}
        run: |
          if [ -z "$CLERK_INTEGRATION_TEST_PK" ]; then
            echo "::error title=Integration tests::The CLERK_INTEGRATION_TEST_PK secret is empty, so every integration test would be skipped."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write .keys.json
        if: env.CLERK_INTEGRATION_TEST_PK != ''
        env:
          CLERK_INTEGRATION_TEST_PK: ${{ secrets.CLERK_INTEGRATION_TEST_PK }}
        run: |
          echo '{"with-email-codes":{"pk":"'"$CLERK_INTEGRATION_TEST_PK"'"}}' > .keys.json

      - name: Run integration tests
        timeout-minutes: 20
        run: ./gradlew :source:api:testDebugUnitTest --tests "com.clerk.api.integration.*" --build-cache

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            source/api/build/test-results/**
            source/api/build/reports/tests/**
          if-no-files-found: warn

  notify:
    needs: integration-test
    if: ${{ !cancelled() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    uses: ./.github/workflows/notify-nightly-failure.yml
    with:
      checks: integration tests
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
