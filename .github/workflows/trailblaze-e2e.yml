name: Trailblaze E2E

on:
  workflow_call:
    secrets:
      CLERK_TEST_KEYS_JSON:
        required: false
  workflow_dispatch:

concurrency:
  group: trailblaze-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-shards:
    name: Select Trailblaze E2E shards
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - id: select
        env:
          HAS_TEST_KEYS: ${{ secrets.CLERK_TEST_KEYS_JSON != '' }}
        run: |
          if [ "$HAS_TEST_KEYS" = "true" ]; then
            echo 'shards=["custom-flow","auth-email","auth-phone","user-profile","session-task-setup-mfa"]' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLERK_TEST_KEYS_JSON is not set, so only the custom-flow shard runs. Add the shared mobile e2e .keys.json (the clerk-ios secret) to run the rest."
            echo 'shards=["custom-flow"]' >> "$GITHUB_OUTPUT"
          fi

  trailblaze-e2e:
    name: Run Trailblaze E2E on Android (${{ matrix.shard }})
    needs: select-shards
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select-shards.outputs.shards) }}

    env:
      TRAILBLAZE_DEVICE: android/emulator-5554
      TRAILBLAZE_EXTRA_ARGS: "--no-capture-video"
      TRAILBLAZE_ADB_TIMEOUT_MS: "30000"
      TRAILBLAZE_ATTEMPTS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "zulu"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup E2E test keys
        if: matrix.shard != 'custom-flow'
        env:
          CLERK_TEST_KEYS_JSON: ${{ secrets.CLERK_TEST_KEYS_JSON }}
        run: |
          set +x
          if [ -z "$CLERK_TEST_KEYS_JSON" ]; then
            echo "::error::CLERK_TEST_KEYS_JSON is not set. Add the shared mobile e2e .keys.json (the clerk-ios secret) to this repository."
            exit 1
          fi
          printf '%s\n' "$CLERK_TEST_KEYS_JSON" > .keys.json
          chmod 600 .keys.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Trailblaze
        run: |
          curl -fsSL https://raw.githubusercontent.com/block/trailblaze/a022ca69b7fecd0ba7659f2c000fb459213c87d6/install.sh | bash
          echo "$HOME/.trailblaze/bin" >> "$GITHUB_PATH"

      - name: Run Trailblaze E2E shard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: scripts/run-e2e-shard.sh ${{ matrix.shard }}

      - name: Collect Trailblaze artifacts
        if: always()
        run: |
          mkdir -p build/trailblaze-artifacts
          if [ -d "$HOME/.trailblaze/logs" ]; then
            cp -R "$HOME/.trailblaze/logs" build/trailblaze-artifacts/logs
          fi

      - name: Upload Trailblaze artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trailblaze-artifacts-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/trailblaze-artifacts/**
            build/reports/**
