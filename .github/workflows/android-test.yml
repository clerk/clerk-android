name: Android Unit Test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-runner-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PACKAGE: e2e-tests
      WATCHED: >-
        e2e-tests
        .github/workflows
        .github/scripts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the test package changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git diff --quiet HEAD^1 HEAD -- $WATCHED; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.package == 'true'
        with:
          node-version: 24

      - name: Install the test package's dependencies
        if: steps.changed.outputs.package == 'true'
        run: npm ci --prefix "$PACKAGE"

      - name: Run the test package's unit tests
        if: steps.changed.outputs.package == 'true'
        run: npm test --prefix "$PACKAGE"

      - name: Typecheck the test package
        if: steps.changed.outputs.package == 'true'
        run: npm run typecheck --prefix "$PACKAGE"

      - name: Run the tests of the scripts in .github/scripts
        if: steps.changed.outputs.package == 'true'
        run: node --test .github/scripts/*.test.mjs

  test-module:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: ":source:api"
            path: "source/api"
            label: "source-api"   # <— safe artifact label (no /)
            task: "testDebugUnitTest"
            save-cache: true
          - module: ":source:ui"
            path: "source/ui"
            label: "source-ui-snapshots"
            task: "verifyPaparazziDebug --tests 'com.clerk.snapshot.*'"
            save-cache: true
          - module: ":source:ui"
            path: "source/ui"
            label: "source-ui-unit"
            task: "verifyPaparazziDebug --tests 'com.clerk.ui.*'"
            save-cache: true
          - module: ":source:telemetry"
            path: "source/telemetry"
            label: "source-telemetry"
            task: "testDebugUnitTest"
          - module: ":e2e"
            path: "e2e"
            label: "e2e"
            task: "testDebugUnitTest"
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache-jdk: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # GitHub keeps 10 GB of Actions cache per repository, so only the slowest jobs save their Gradle state from main.
          cache-read-only: ${{ github.ref != 'refs/heads/main' || !matrix.save-cache }}
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests for ${{ matrix.module }}
        run: ./gradlew ${{ matrix.module }}:${{ matrix.task }} --build-cache --parallel

      - name: Upload test results (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.label }}    # <— no slashes
          path: |
            ${{ matrix.path }}/build/test-results/**
            ${{ matrix.path }}/build/reports/tests/**
          if-no-files-found: warn

      - name: Upload Paparazzi report
        if: failure() && matrix.module == ':source:ui' && hashFiles('source/ui/build/paparazzi/failures/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-report-${{ matrix.label }}
          retention-days: 7
          path: |
            source/ui/build/reports/paparazzi/**
            source/ui/build/paparazzi/**

      - name: Add run summary
        if: failure() && matrix.module == ':source:ui' && hashFiles('source/ui/build/paparazzi/failures/**') != ''
        run: |
          {
            echo "### Paparazzi differences detected";
            echo "";
            echo "- An artifact whose name starts with **paparazzi-report** was uploaded with the HTML report and image diffs.";
            echo "- If the change is intended, start the **Paparazzi Verify** workflow on your branch with **record** checked and commit the images from its **paparazzi-snapshots** artifact. Snapshots recorded on another machine render differently.";
          } >> "$GITHUB_STEP_SUMMARY"

  api-check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache-jdk: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check public ABI
        run: ./gradlew apiCheck --build-cache --parallel
