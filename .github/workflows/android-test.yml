name: Android Unit Test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  e2e-runner-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      PACKAGE: e2e-tests
      WATCHED: >-
        e2e-tests
        .github/workflows/android-test.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the test package changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git diff --quiet HEAD^1 HEAD -- $WATCHED; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.package == 'true'
        with:
          node-version: 24

      - name: Install the test package's dependencies
        if: steps.changed.outputs.package == 'true'
        run: npm ci --prefix "$PACKAGE"

      - name: Run the test package's unit tests
        if: steps.changed.outputs.package == 'true'
        run: npm test --prefix "$PACKAGE"

      - name: Typecheck the test package
        if: steps.changed.outputs.package == 'true'
        run: npm run typecheck --prefix "$PACKAGE"

  test-module:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - module: ":source:api"
            path: "source/api"
            label: "source-api"   # <— safe artifact label (no /)
            task: "testDebugUnitTest"
          - module: ":source:ui"
            path: "source/ui"
            label: "source-ui"
            task: "testDebugUnitTest"
          - module: ":source:telemetry"
            path: "source/telemetry"
            label: "source-telemetry"
            task: "testDebugUnitTest"
          - module: ":e2e"
            path: "e2e"
            label: "e2e"
            task: "testDebugUnitTest"
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests for ${{ matrix.module }}
        run: ./gradlew ${{ matrix.module }}:${{ matrix.task }} --build-cache --parallel

      - name: Upload test results (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.label }}    # <— no slashes
          path: |
            ${{ matrix.path }}/build/test-results/**
            ${{ matrix.path }}/build/reports/tests/**
          if-no-files-found: warn

  api-check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check public ABI
        run: ./gradlew apiCheck --build-cache --parallel
