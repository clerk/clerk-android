name: Android Unit Test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main", "sam/clerk-ui" ]

jobs:
  verify-skill:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    env:
      SKILL: .claude/skills/verify-clerk-android
      WATCHED: >-
        .claude/skills/verify-clerk-android
        .github/workflows/android-test.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether the verify skill changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git diff --quiet HEAD^1 HEAD -- $WATCHED; then
            echo "skill=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.skill == 'true'
        with:
          node-version: 24

      - name: Install the verify skill's dependencies
        if: steps.changed.outputs.skill == 'true'
        run: npm ci --prefix "$SKILL"

      - name: Run the verify skill's unit tests
        if: steps.changed.outputs.skill == 'true'
        run: npm test --prefix "$SKILL"

      - name: Typecheck the verify skill
        if: steps.changed.outputs.skill == 'true'
        run: npm run typecheck --prefix "$SKILL"

  test-module:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - module: ":source:api"
            path: "source/api"
            label: "source-api"   # <— safe artifact label (no /)
          - module: ":source:ui"
            path: "source/ui"
            label: "source-ui"
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests for ${{ matrix.module }}
        run: ./gradlew ${{ matrix.module }}:testDebugUnitTest --build-cache --parallel

      - name: Upload test results (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.label }}    # <— no slashes
          path: |
            ${{ matrix.path }}/build/test-results/**
            ${{ matrix.path }}/build/reports/tests/**
          if-no-files-found: warn
