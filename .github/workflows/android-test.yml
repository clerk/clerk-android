name: Android Unit Test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main", "sam/clerk-ui" ]

jobs:
  test-module:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - module: ":source:api"
            path: "source/api"
            label: "source-api"   # <— safe artifact label (no /)
          - module: ":source:ui"
            path: "source/ui"
            label: "source-ui"
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests for ${{ matrix.module }}
        run: ./gradlew ${{ matrix.module }}:testDebugUnitTest --build-cache --parallel

      - name: Verify instrumentation result gates
        if: matrix.module == ':source:api'
        run: python3 -B scripts/test_android_test_results.py

      - name: Upload test results (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.label }}    # <— no slashes
          path: |
            ${{ matrix.path }}/build/test-results/**
            ${{ matrix.path }}/build/reports/tests/**
          if-no-files-found: warn

  packaged-core-platforms:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            platform-case: unsupportedPasskeysAreNotAdvertisedAndFailBeforePresentation
          - api-level: 36
            platform-case: supportedPlatformAdvertisesPasskeysAndPackagesBiometricPermission
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile packaged core tests
        run: ./gradlew :source:api:assembleDebugAndroidTest --build-cache
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify packaged core and platform capabilities
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: |
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "${{ matrix.api-level }}"
            ./gradlew :source:api:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.clerk.api.PackagedCoreTest#generatedApiUsesPackagedCore' --build-cache
            python3 scripts/android_test_results.py --expected 'com.clerk.api.PackagedCoreTest#generatedApiUsesPackagedCore'
            mkdir -p source/api/build/platform-test-results
            cp -R source/api/build/outputs/androidTest-results/connected/debug source/api/build/platform-test-results/core
            ./gradlew :source:api:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.clerk.api.PlatformCapabilityTest --build-cache
            python3 scripts/android_test_results.py --expected 'com.clerk.api.PlatformCapabilityTest#${{ matrix.platform-case }}'
            cp -R source/api/build/outputs/androidTest-results/connected/debug source/api/build/platform-test-results/platform
            if [ "${{ matrix.api-level }}" = "36" ]; then bash scripts/run-token-request-contract.sh; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then bash scripts/run-auth-view-journey.sh; fi
      - name: Upload platform test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-core-api-${{ matrix.api-level }}-x86_64
          path: |
            source/api/build/platform-test-results/**
            source/api/build/outputs/androidTest-results/**
            source/api/build/reports/androidTests/**
            source/ui/build/outputs/androidTest-results/**
            source/ui/build/outputs/connected_android_test_additional_output/**
            source/ui/build/reports/androidTests/**
          if-no-files-found: warn
